name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend lint, type-check, tests and coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-

      - name: Install backend dependencies
        run: npm ci

      - name: TypeScript type-check backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint backend
        run: npm run lint

      - name: Run backend unit tests
        run: npm test

      - name: Run backend coverage threshold
        run: npm run test:coverage

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage
